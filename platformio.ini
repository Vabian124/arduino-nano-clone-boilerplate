; Arduino Nano (ATmega328P) boilerplate
;
; Upload tip if stk500_getsync fails:
;   1) Switch env (nano_new vs nano_old)
;   2) Hold RESET, start upload, release when "Uploading" appears
;   3) Use a data USB cable (not charge-only)
;
; Quick start:
;   - Flip demos in include/config.h
;   - Pin cheat-sheet: include/board_pins.h
;   - Helpers: include/tools.h
;   - Upload: PlatformIO → env nano_new → Upload
;   - Monitor: 9600 baud

[platformio]
default_envs = nano_new

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
monitor_filters = time
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
; Optional: pin your port (remove for auto-detect)
upload_port = COM8

; Newer Optiboot — 115200 (use this if nano_old fails)
[env:nano_new]
board = nanoatmega328new

; Clone / old ATmegaBOOT — 57600
[env:nano_old]
board = nanoatmega328
upload_speed = 57600
